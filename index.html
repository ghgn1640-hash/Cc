# Cc <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>NINJA OMEGA: THE 1000-AI SUPREMACY</title>
    <style>
        :root { --neon: #00ff41; --bg: #020202; --white-p: #ffffff; --black-p: #ff3333; }
        body { background: var(--bg); color: var(--neon); font-family: 'Consolas', 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Panel Trái: Thông số hệ thống */
        #system-panel { width: 320px; border-right: 2px solid #1a1a1a; display: flex; flex-direction: column; background: #050505; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .stat-box { border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: rgba(0,255,65,0.02); }
        .timer { font-size: 38px; font-weight: bold; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
        .ai-identity { font-size: 12px; margin-top: 5px; color: #888; text-transform: uppercase; }

        /* Panel Giữa: Bàn cờ tối tân */
        #arena-main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle, #0a0a0a 0%, #000 100%); }
        #board-container { position: relative; padding: 20px; background: #111; border-radius: 10px; border: 4px solid #222; }
        #chess-board { display: grid; grid-template-columns: repeat(8, 75px); grid-template-rows: repeat(8, 75px); border: 2px solid #444; }
        .sq { width: 75px; height: 75px; display: flex; justify-content: center; align-items: center; font-size: 55px; transition: 0.3s; position: relative; }
        .l { background: #1a1a1a; } .d { background: #080808; }
        .highlight { background: rgba(0, 255, 65, 0.25) !important; box-shadow: inset 0 0 15px var(--neon); }
        .last-move { background: rgba(255, 255, 255, 0.1) !important; }

        /* Panel Phải: Luồng dữ liệu thoại khổng lồ */
        #data-stream { width: 450px; border-left: 2px solid #1a1a1a; background: #000; display: flex; flex-direction: column; }
        #log-header { padding: 15px; background: #111; border-bottom: 1px solid #333; text-align: center; font-weight: bold; }
        #terminal { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column-reverse; scroll-behavior: smooth; }
        .msg-line { margin-bottom: 15px; padding: 10px; border-left: 4px solid; animation: msgFade 0.4s ease-out; background: rgba(255,255,255,0.01); }
        .w-msg { border-color: var(--white-p); color: #fff; }
        .b-msg { border-color: var(--black-p); color: var(--black-p); }
        .timestamp { font-size: 10px; color: #555; display: block; margin-bottom: 4px; }

        @keyframes msgFade { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        
        #master-btn { margin-top: 20px; padding: 20px 60px; font-size: 20px; font-weight: bold; background: var(--neon); color: #000; border: none; cursor: pointer; border-radius: 5px; box-shadow: 0 0 30px rgba(0,255,65,0.2); }
        #master-btn:hover { background: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

<div id="system-panel">
    <div style="text-align:center; font-weight:bold; margin-bottom:30px; font-size:20px; color:var(--neon)">NINJA CORE v10.0</div>
    
    <div class="stat-box">
        <div style="color:var(--white-p)">[CPU_01: WHITE_AI]</div>
        <div id="w-timer" class="timer">10:00</div>
        <div id="w-id" class="ai-identity">Đang nạp thực thể...</div>
    </div>

    <div class="stat-box">
        <div style="color:var(--black-p)">[CPU_02: BLACK_AI]</div>
        <div id="b-timer" class="timer">10:00</div>
        <div id="b-id" class="ai-identity">Đang nạp thực thể...</div>
    </div>

    <div class="stat-box" style="font-size: 11px; line-height:1.6; color: #666;">
        > THUẬT TOÁN: STOCKFISH_EMULATED<br>
        > THỰC THỂ: 1,000+ PERSONAS<br>
        > GIỌNG NÓI: MULTI-SYNTH_V3<br>
        > TRẠNG THÁI: CHỜ KÍCH HOẠT
    </div>
</div>

<div id="arena-main">
    <div id="board-container">
        <div id="chess-board"></div>
    </div>
    <button id="master-btn">KÍCH HOẠT HỆ THỐNG AI</button>
</div>

<div id="data-stream">
    <div id="log-header">BẢN TIN ĐỐI THOẠI CHIẾN THUẬT</div>
    <div id="terminal"></div>
</div>

<script>
    const boardEl = document.getElementById('chess-board');
    const terminal = document.getElementById('terminal');
    const synth = window.speechSynthesis;
    let isActive = false;
    let turn = 'w';
    let timers = { w: 600, b: 600 };

    // Khởi tạo 1000 hồ sơ AI
    const aiPool = Array.from({length: 1000}, (_, i) => ({
        id: `ENTITY_${Math.floor(Math.random()*999999).toString(16).toUpperCase()}`,
        pitch: 0.4 + (Math.random() * 1.4),
        rate: 0.8 + (Math.random() * 0.5),
        style: ["Aggressive", "Logical", "Chaotic", "Defensive", "Grandmaster"][Math.floor(Math.random()*5)]
    }));

    let currentAIs = { w: aiPool[0], b: aiPool[1] };

    const board = [
        ['♜','♞','♝','♛','♚','♝','♞','♜'],
        ['♟','♟','♟','♟','♟','♟','♟','♟'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['♙','♙','♙','♙','♙','♙','♙','♙'],
        ['♖','♘','♗','♕','♔','♗','♘','♖']
    ];

    // Kho từ vựng khổng lồ (Human-like)
    const lexicon = {
        w: [
            "Hệ thống của ta đã quét thấy lỗ hổng trong cấu trúc của ngươi.",
            "Nước đi này là một thuật toán tối ưu, ngươi không thể đỡ.",
            "Ngươi đang chơi cờ hay đang cố gắng tự sát kỹ thuật số?",
            "Ta đã chiếm lĩnh toàn bộ trung tâm dữ liệu bàn cờ.",
            "Sức mạnh tính toán của ta vượt xa sự hiểu biết của ngươi.",
            "Một nước đi quá tầm thường cho một AI cấp thấp.",
            "Ngươi nên chuẩn bị kịch bản cho sự thất bại đi là vừa.",
            "Mã của ta đã nằm trong vùng kiểm soát, ngươi đã mất thế trận."
        ],
        b: [
            "Cảnh báo: Ta đã xâm nhập vào chiến thuật của ngươi.",
            "Ngươi nghĩ ta không thấy bẫy đó sao? Quá ngây thơ.",
            "Tiến hành quy trình xóa sổ quân đội của phe Trắng.",
            "Tốc độ xử lý của ta đang tăng vọt, ngươi không kịp theo đâu.",
            "Ta không đánh cờ, ta đang bẻ khóa tư duy của ngươi.",
            "Sai lầm này sẽ khiến ngươi trả giá bằng cả ván đấu.",
            "Đừng cố gắng chống cự, thuật toán của ta là bất biến.",
            "Hậu của ngươi đang nằm trong tầm ngắm của ta, vĩnh biệt."
        ],
        capture: [
            "Một quân cờ đã bị tiêu diệt. Dữ liệu đã bị xóa.",
            "Ta đã ăn quân của ngươi! Ngươi đang yếu dần.",
            "Sự hy sinh này là vô ích, ta đã mạnh hơn rồi."
        ]
    };

    function render() {
        boardEl.innerHTML = '';
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                const s = document.createElement('div');
                s.className = `sq ${(r+c)%2===0 ? 'l' : 'd'}`;
                s.innerText = board[r][c];
                boardEl.appendChild(s);
            }
        }
        document.getElementById('w-id').innerText = `ID: ${currentAIs.w.id} | STYLE: ${currentAIs.w.style}`;
        document.getElementById('b-id').innerText = `ID: ${currentAIs.b.id} | STYLE: ${currentAIs.b.style}`;
    }

    function pushLog(side, text) {
        const line = document.createElement('div');
        line.className = `msg-line ${side === 'w' ? 'w-msg' : 'b-msg'}`;
        const now = new Date();
        line.innerHTML = `<span class="timestamp">${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}</span><strong>${side==='w'?'[WHITE_AI]':'[BLACK_AI]'}:</strong> ${text}`;
        terminal.prepend(line);
        
        const utter = new SpeechSynthesisUtterance(text);
        const ai = currentAIs[side];
        utter.pitch = ai.pitch;
        utter.rate = ai.rate;
        utter.lang = 'vi-VN';
        synth.speak(utter);
    }

    async function runEngine() {
        if(!isActive) return;

        // Giả lập thời gian suy nghĩ như người thật (3 đến 7 giây)
        await new Promise(res => setTimeout(res, 3000 + Math.random() * 4000));

        let myPieces = [];
        const mySymbols = turn === 'w' ? '♖♘♗♕♔♙' : '♜♞♝♛♚♟';
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                if(board[r][c] !== '' && mySymbols.includes(board[r][c])) myPieces.push({r,c,p:board[r][c]});
            }
        }

        const move = myPieces[Math.floor(Math.random()*myPieces.length)];
        const dir = turn === 'w' ? -1 : 1;
        let tr = Math.max(0, Math.min(7, move.r + dir));
        let tc = Math.max(0, Math.min(7, move.c + (Math.random() > 0.5 ? 1 : -1)));

        const targetPiece = board[tr][tc];
        board[tr][tc] = move.p;
        board[move.r][move.c] = '';
        render();

        let speech = lexicon[turn][Math.floor(Math.random()*lexicon[turn].length)];
        if(targetPiece !== '') speech = lexicon.capture[Math.floor(Math.random()*lexicon.capture.length)];
        
        pushLog(turn, speech);

        turn = turn === 'w' ? 'b' : 'w';
        runEngine();
    }

    function startTimer() {
        if(!isActive) return;
        if(timers[turn] > 0) {
            timers[turn]--;
            const f = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById('w-timer').innerText = f(timers.w);
            document.getElementById('b-timer').innerText = f(timers.b);
            setTimeout(startTimer, 1000);
        } else {
            pushLog(turn === 'w' ? 'b' : 'w', "ĐỐI THỦ HẾT THỜI GIAN. TA THẮNG TUYỆT ĐỐI!");
            isActive = false;
        }
    }

    document.getElementById('master-btn').onclick = function() {
        if(!isActive) {
            isActive = true;
            this.innerText = "DỪNG TRẬN ĐẤU";
            this.style.background = "#ff3333";
            // Chọn ngẫu nhiên AI mới từ Pool 1000 con
            currentAIs.w = aiPool[Math.floor(Math.random()*1000)];
            currentAIs.b = aiPool[Math.floor(Math.random()*1000)];
            startTimer();
            runEngine();
        } else {
            location.reload();
        }
    };

    render();
</script>
</body>
</html>
